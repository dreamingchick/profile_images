name: Test and deploy to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-deploy.yml"
      - "src/**"
      - "public/**"
      - "migrations/**"
      - "tests/**"
      - "package.json"
      - "wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-images-production
  cancel-in-progress: false

jobs:
  test:
    name: Test source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run automated tests
        run: npm run check

  deploy:
    name: Deploy production
    needs: test
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Cloudflare configuration and secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const required = ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID",
            "CLOUDFLARE_D1_DATABASE_ID", "TURNSTILE_SITE_KEY",
            "ADMIN_PASSWORD", "SESSION_SECRET", "TURNSTILE_SECRET"];
          const missing = required.filter((key) => !process.env[key]);
          if (missing.length) throw Error("Missing GitHub Secrets/Variables: " + missing.join(", "));
          if (process.env.ADMIN_PASSWORD.length < 12) throw Error("ADMIN_PASSWORD must be at least 12 characters");
          if (process.env.SESSION_SECRET.length < 32) throw Error("SESSION_SECRET must be at least 32 characters");
          if (!/^[0-9a-fA-F-]{36}$/.test(process.env.CLOUDFLARE_D1_DATABASE_ID)) throw Error("Invalid D1 database ID");
          const path = "wrangler.jsonc";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          config.d1_databases[0].database_id = process.env.CLOUDFLARE_D1_DATABASE_ID;
          config.vars.TURNSTILE_SITE_KEY = process.env.TURNSTILE_SITE_KEY;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          console.log("Configuration validated. Secrets are not written to the repository.");
          NODE
      - name: Apply remote D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply profile-images-db --remote
      - name: Deploy Worker and provision runtime secrets
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            ADMIN_PASSWORD
            SESSION_SECRET
            TURNSTILE_SECRET
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
      - name: Smoke-test deployed site
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "No deployment URL reported; check Cloudflare dashboard."
            exit 1
          fi
          curl --fail --silent --show-error --retry 2 "$DEPLOYMENT_URL/api/config" > /dev/null
          curl --fail --silent --show-error --retry 2 "$DEPLOYMENT_URL/api/gallery" > /dev/null
